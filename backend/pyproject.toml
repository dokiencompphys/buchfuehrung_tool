[project]
name = "buchfuehrung"
version = "0.1.0"
description = "Backend für die Monats-Buchführung: Feiertage, OCR, Export, Ablage, Analyse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "holidays>=0.60",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "fpdf2>=2.7",
    "pillow>=10.0",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
# OCR-Modelle sind groß und optional. Installation z. B.: uv sync --extra surya
surya = ["surya-ocr>=0.6"]
paddle = ["paddleocr>=2.8", "paddlepaddle>=2.6"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buchfuehrung"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
